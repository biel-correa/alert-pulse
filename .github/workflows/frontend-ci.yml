name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

env:
  NODE_VERSION: '22.x'
  AWS_REGION: us-east-1
  S3_BUCKET: alert-pulse-dashboard
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  test-and-build:
    name: Lint, Test & Compile SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Inject Environment from GitHub Secret
        env:
          ENV_CONTENT: ${{ secrets.FRONTEND_ENVIRONMENT_TS }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            echo "Writing frontend/src/environments/environment.ts from FRONTEND_ENVIRONMENT_TS secret..."
            printf '%s\n' "$ENV_CONTENT" > frontend/src/environments/environment.ts
          else
            echo "FRONTEND_ENVIRONMENT_TS secret is empty or not provided. Using existing environment file."
          fi

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Angular Headless Karma Tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Production SPA Bundle
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-dist
          path: frontend/dist/frontend/browser/

  deploy-s3-cloudfront:
    name: Deploy to S3 & Invalidate CloudFront CDN
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-dist
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Static Assets to S3 Bucket
        run: |
          echo "Syncing production SPA assets to s3://${{ env.S3_BUCKET }}..."
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete --cache-control "max-age=31536000,public,immutable" --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront CDN Edge Cache
        run: |
          if [ -n "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            echo "Creating CloudFront cache invalidation for /*..."
            aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          else
            echo "No CloudFront Distribution ID specified. Skipping edge cache invalidation."
          fi
